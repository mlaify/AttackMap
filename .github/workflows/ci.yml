name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6"
          ruff check src/attackmap

  test:
    name: pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[llm,dev]"

      - name: Run tests
        run: pytest -q

  plugin-matrix:
    # Every official analyzer's own tests against this core (#254), so a core
    # change that breaks a plugin shows up here, before a release.
    name: plugin ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - attackmap-analyzer-python
          - attackmap-analyzer-rust
          - attackmap-analyzer-go
          - attackmap-analyzer-java-spring
          - attackmap-analyzer-dotnet
          - attackmap-analyzer-terraform
          - attackmap-analyzer-c
          - attackmap-analyzer-cpp
          - attackmap-analyzer-swift
          - attackmap-analyzer-node-service
          - attackmap-analyzer-atproto
          - attackmap-analyzer-php-web
          - attackmap-analyzer-php-laminas
          - attackmap-analyzer-omeka-s
          - attackmap-analyzer-iac
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: mlaify/${{ matrix.plugin }}
          path: plugin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install this core, then the plugin
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e "./plugin[dev]"

      - name: Run the plugin's tests
        working-directory: plugin
        run: pytest -q

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
