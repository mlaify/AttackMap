name: Real-world benchmark

# Precision/recall on pinned public repos (evals/realworld, #197). Weekly and
# on demand; a PR that changes detection runs it by hand. Fails if any scored
# class drops more than 5 points below evals/realworld/baseline.json.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AttackMap with the official analyzers
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Fetch the corpus (pinned commits; scanned, never run)
        run: python scripts/realworld_corpus.py "$RUNNER_TEMP/corpus"

      - name: Score against the labels and the baseline
        run: |
          attackmap bench --benchmark evals/realworld/benchmark.json --root "$RUNNER_TEMP/corpus" \
            --output "$RUNNER_TEMP/bench" --baseline evals/realworld/baseline.json

      - name: Job summary
        if: always()
        run: cat "$RUNNER_TEMP/bench/benchmark-results.md" >> "$GITHUB_STEP_SUMMARY" || true
