# Pushing a v* tag builds the wheel and sdist and attaches them to a GitHub release.
# mlaify/ci-publish picks up the files within six hours and adds them to https://pkg.mlaify.io/pypi.
# The `pypi` job then uploads the same files to PyPI. Run it by hand (workflow_dispatch with a tag)
# to put a release that already exists on PyPI.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload to PyPI (e.g. v1.2.3)"
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # The operator approves each release here: the `release` environment has a required
    # reviewer and accepts only v* tags. Nothing reaches the GitHub release, and so the
    # package index (ci-publish reads the releases), until the run is approved.
    environment:
      name: release
      url: https://pkg.mlaify.io/pypi/simple/attackmap/
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q build==1.6.1
          "$RUNNER_TEMP/venv/bin/python" -m build

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver=${TAG#v}
          ls dist
          if ! compgen -G "dist/*-${ver}-py3-none-any.whl" >/dev/null || ! compgen -G "dist/*-${ver}.tar.gz" >/dev/null; then
            echo "::error::tag $TAG does not match the version that was built"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ver=${TAG#v}
          # The notes are this version's CHANGELOG section.
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release that already exists (made by hand when Actions was
            # unavailable, or a re-run) keeps its assets: upload only what is
            # missing, never replace a file users may already have fetched.
            existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for f in dist/*; do
              if grep -qx "$(basename "$f")" <<<"$existing"; then
                echo "already attached, left as is: $(basename "$f")"
              else
                gh release upload "$TAG" "$f"
              fi
            done
          elif [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$TAG" dist/* --verify-tag --title "${GITHUB_REPOSITORY#*/} $ver" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* --verify-tag --title "${GITHUB_REPOSITORY#*/} $ver" --generate-notes
          fi

  # Uploads the files attached to the GitHub release, so PyPI serves the same bytes as
  # pkg.mlaify.io. Trusted publishing: no PyPI token is stored anywhere; PyPI accepts the upload
  # only from this workflow running in the `pypi` environment, which has a required reviewer.
  pypi:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (needs.release.result == 'skipped' && github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/attackmap/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*([.+-]?[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          ver=${TAG#v}
          gh release download "$TAG" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          ls -l dist
          if ! compgen -G "dist/*-${ver}-py3-none-any.whl" >/dev/null || ! compgen -G "dist/*-${ver}.tar.gz" >/dev/null; then
            echo "::error::release $TAG has no wheel and sdist for version $ver"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
