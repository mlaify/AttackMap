name: Build & publish container image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0). Defaults to latest on PyPI if unset."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build args
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Strip leading "v" from tag (e.g. v0.1.0 -> 0.1.0).
          # Falls back to the workflow_dispatch input if not tag-triggered.
          if [ -n "${REF_NAME}" ] && [ "${REF_TYPE}" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Derive major and major.minor for the additional image tags.
          # Both stay empty if version is unset (e.g. workflow_dispatch
          # with no input) — the tag rules skip empty values.
          if [ -n "${version}" ]; then
            major="$(echo "${version}" | cut -d. -f1)"
            major_minor="$(echo "${version}" | cut -d. -f1-2)"
          else
            major=""
            major_minor=""
          fi
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${major_minor}" >> "$GITHUB_OUTPUT"

      # Race guard: the tag push fires BOTH this workflow and the release
      # workflow simultaneously. The release workflow has an approval gate
      # + 5-min wait timer before publishing to PyPI, so this docker build
      # will otherwise `pip install attackmap==0.2.0` before PyPI has it
      # and fail with "No matching distribution". Poll until the version
      # shows up (with a generous timeout to cover approval delay).
      - name: Wait for PyPI to serve the version
        if: steps.vars.outputs.version != ''
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/attackmap/${VERSION}/json" || echo "000")
            if [ "$code" = "200" ]; then
              echo "attackmap ${VERSION} is live on PyPI (after ${attempt} attempt(s))."
              exit 0
            fi
            echo "Waiting for attackmap ${VERSION} on PyPI (attempt ${attempt}/60, got HTTP ${code})..."
            sleep 30
          done
          echo "PyPI never served attackmap ${VERSION} within 30 minutes." >&2
          exit 1

      # We derive tags from the resolved version (works for both tag
      # pushes and workflow_dispatch with an explicit version input).
      # The metadata-action's built-in `type=semver` rules only fire when
      # the git ref is itself a semver tag, so they silently drop version
      # tags on workflow_dispatch runs — which is what left 0.2.0
      # untagged the first time.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/attackmap
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }},enable=${{ steps.vars.outputs.version != '' }}
            type=raw,value=${{ steps.vars.outputs.major_minor }},enable=${{ steps.vars.outputs.major_minor != '' }}
            type=raw,value=${{ steps.vars.outputs.major }},enable=${{ steps.vars.outputs.major != '' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ATTACKMAP_VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
