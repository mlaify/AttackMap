[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attackmap"
# Single-sourced from src/attackmap/__init__.py (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "AI-assisted defensive security analyzer for codebases — scans a repository, models assets and controls, finds cross-cutting weaknesses, and generates an evidence-grounded review with MITRE ATT&CK mappings and detection-engineering hints."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
  {name = "AttackMap Contributors"},
]
maintainers = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
]
keywords = [
  "security",
  "static-analysis",
  "appsec",
  "defensive-security",
  "threat-modeling",
  "attack-surface",
  "mitre-attack",
  "detection-engineering",
  "code-review",
  "llm",
  "claude",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "networkx>=3.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.40.0",
  "openai>=1.60.0",
]
all = [
  "attackmap[llm]",
  "attackmap-analyzer-python @ git+https://github.com/mlaify/attackmap-analyzer-python.git@1bcce0dd5d639cb83ada65cc3f5024bb5a1d9782",
  "attackmap-analyzer-rust @ git+https://github.com/mlaify/attackmap-analyzer-rust.git@c2e02d2855e6102153140f2644504b1cc0a95fb8",
  "attackmap-analyzer-go @ git+https://github.com/mlaify/attackmap-analyzer-go.git@3fb5023704ba380cb5388cfea9e8753177b774e8",
  "attackmap-analyzer-java-spring @ git+https://github.com/mlaify/attackmap-analyzer-java-spring.git@1da4a81c1368e15371e8c285fe46ce964ab5c8fd",
  "attackmap-analyzer-dotnet @ git+https://github.com/mlaify/attackmap-analyzer-dotnet.git@2c28e7342301ee2d193e670fd45b663e6781257a",
  "attackmap-analyzer-terraform @ git+https://github.com/mlaify/attackmap-analyzer-terraform.git@8168393fbe430e8ff0273efd8c934a7cbaf88a3c",
  "attackmap-analyzer-c @ git+https://github.com/mlaify/attackmap-analyzer-c.git@4c2a6b3e48fbd044b85a6bcacd5845ed9464c125",
  "attackmap-analyzer-cpp @ git+https://github.com/mlaify/attackmap-analyzer-cpp.git@304d686630dd0d2a8afe66989e6ef9e84ecce8b1",
  "attackmap-analyzer-swift @ git+https://github.com/mlaify/attackmap-analyzer-swift.git@bae13e58a49f46c15992197517cf9c036a75d83c",
  "attackmap-analyzer-node-service @ git+https://github.com/mlaify/attackmap-analyzer-node-service.git@39ecbae65895e8cea546efa73eb7d031156dd4f8",
  "attackmap-analyzer-atproto @ git+https://github.com/mlaify/attackmap-analyzer-atproto.git@8bd04cdc8df6e0da02899473b681c50d47f5028a",
  "attackmap-analyzer-php-web @ git+https://github.com/mlaify/attackmap-analyzer-php-web.git@d7329a58d16270bdefa2768f5e6deed6421e32f0",
  "attackmap-analyzer-php-laminas @ git+https://github.com/mlaify/attackmap-analyzer-php-laminas.git@b7101504589f12d934e830237ada83bd0a66fbac",
  "attackmap-analyzer-omeka-s @ git+https://github.com/mlaify/attack-map-analyzer-omeka-s.git@b4b7d3a2e58710860ecef0efdc8a56222557273d",
  "attackmap-analyzer-iac @ git+https://github.com/mlaify/attackmap-analyzer-iac.git@5a763ad5822a2309ba94da9b56d6392db65cbd6e",
]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
  "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/mlaify/AttackMap"
Documentation = "https://github.com/mlaify/AttackMap/wiki"
Repository = "https://github.com/mlaify/AttackMap"
Issues = "https://github.com/mlaify/AttackMap/issues"
Changelog = "https://github.com/mlaify/AttackMap/blob/main/CHANGELOG.md"

[project.scripts]
attackmap = "attackmap.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "attackmap.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
