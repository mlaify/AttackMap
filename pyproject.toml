[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attackmap"
# Single-sourced from src/attackmap/__init__.py (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "AI-assisted defensive security analyzer for codebases — scans a repository, models assets and controls, finds cross-cutting weaknesses, and generates an evidence-grounded review with MITRE ATT&CK mappings and detection-engineering hints."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
  {name = "AttackMap Contributors"},
]
maintainers = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
]
keywords = [
  "security",
  "static-analysis",
  "appsec",
  "defensive-security",
  "threat-modeling",
  "attack-surface",
  "mitre-attack",
  "detection-engineering",
  "code-review",
  "llm",
  "claude",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "networkx>=3.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.40.0",
  "openai>=1.60.0",
]
all = [
  "attackmap[llm]",
  "attackmap-analyzer-python @ git+https://github.com/mlaify/attackmap-analyzer-python.git@149aaba697212b4866ad3660999a4e12ea75b9c9",
  "attackmap-analyzer-rust @ git+https://github.com/mlaify/attackmap-analyzer-rust.git@8699781affb47f2a55461e2e02847dffb4c2c272",
  "attackmap-analyzer-go @ git+https://github.com/mlaify/attackmap-analyzer-go.git@6c67c751f56be6a736cdcecdd290cbf0071750e0",
  "attackmap-analyzer-java-spring @ git+https://github.com/mlaify/attackmap-analyzer-java-spring.git@969de3ee93a1ce62844321fa92a1c94571154622",
  "attackmap-analyzer-dotnet @ git+https://github.com/mlaify/attackmap-analyzer-dotnet.git@c7e538609728fac3be5b9e9d396b1a4a8613ebd1",
  "attackmap-analyzer-terraform @ git+https://github.com/mlaify/attackmap-analyzer-terraform.git@d6df7d0a5358ada5f7247c8441e06b3d6fff1466",
  "attackmap-analyzer-c @ git+https://github.com/mlaify/attackmap-analyzer-c.git@a36b9ad3cfea5c17c1e556803923df3aac4e0fe8",
  "attackmap-analyzer-cpp @ git+https://github.com/mlaify/attackmap-analyzer-cpp.git@2529dd8c81056301796a1033ff48b4059ab54d2e",
  "attackmap-analyzer-swift @ git+https://github.com/mlaify/attackmap-analyzer-swift.git@9a80ec2c3a3f4d3c3a01048592a19e287b16584e",
  "attackmap-analyzer-node-service @ git+https://github.com/mlaify/attackmap-analyzer-node-service.git@432f64aeb1e55cf0f5030af2be16220a6e991e50",
  "attackmap-analyzer-atproto @ git+https://github.com/mlaify/attackmap-analyzer-atproto.git@71f4ab223f8c16118282268fdd7bf0f4d4d8f0b3",
  "attackmap-analyzer-php-web @ git+https://github.com/mlaify/attackmap-analyzer-php-web.git@e4c095f0e9ebf986014762f124943dec908d0951",
  "attackmap-analyzer-php-laminas @ git+https://github.com/mlaify/attackmap-analyzer-php-laminas.git@9780fe93f7341a8411ffa88a564e063290ecbf18",
  "attackmap-analyzer-omeka-s @ git+https://github.com/mlaify/attackmap-analyzer-omeka-s.git@c8698bc463f4941fb9cc9c28a0288a03d1c1892d",
  "attackmap-analyzer-iac @ git+https://github.com/mlaify/attackmap-analyzer-iac.git@2897b1d1c48f6f778759b876ad5f7a23fcc04cd1",
]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
  "jsonschema>=4.0",
  # Validates the generated Sigma rules in tests (#251); not a runtime dependency.
  "pysigma>=2.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mlaify/AttackMap"
Documentation = "https://github.com/mlaify/AttackMap/wiki"
Repository = "https://github.com/mlaify/AttackMap"
Issues = "https://github.com/mlaify/AttackMap/issues"
Changelog = "https://github.com/mlaify/AttackMap/blob/main/CHANGELOG.md"

[project.scripts]
attackmap = "attackmap.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Declarative taint sink registry (#240).
attackmap = ["taint_sinks.yaml"]
# Sigma rule templates for detection opportunities (#251).
"attackmap.detections" = ["*.yml"]

[tool.setuptools.dynamic]
version = {attr = "attackmap.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# Pyflakes only (#231): undefined names, unused imports/locals. Style rules
# are out of scope; CI runs this on src/attackmap.
select = ["F"]
