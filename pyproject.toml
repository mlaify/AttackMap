[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attackmap"
# Single-sourced from src/attackmap/__init__.py (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "AI-assisted defensive security analyzer for codebases — scans a repository, models assets and controls, finds cross-cutting weaknesses, and generates an evidence-grounded review with MITRE ATT&CK mappings and detection-engineering hints."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
  {name = "AttackMap Contributors"},
]
maintainers = [
  {name = "Matthew Davis", email = "mlaify@mlaify.io"},
]
keywords = [
  "security",
  "static-analysis",
  "appsec",
  "defensive-security",
  "threat-modeling",
  "attack-surface",
  "mitre-attack",
  "detection-engineering",
  "code-review",
  "llm",
  "claude",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "networkx>=3.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = [
  "anthropic>=0.40.0",
  "openai>=1.60.0",
]
all = [
  "attackmap[llm]",
  "attackmap-analyzer-python @ git+https://github.com/mlaify/attackmap-analyzer-python.git@44ff509870de88512f37f080930dd2f2d4df3858",
  "attackmap-analyzer-rust @ git+https://github.com/mlaify/attackmap-analyzer-rust.git@884335b044d50677ee7ebc0b5d7bf1e6f79ca8d8",
  "attackmap-analyzer-go @ git+https://github.com/mlaify/attackmap-analyzer-go.git@19e4d5981fb286ff8a6029a8f7f3b31e41ee3a34",
  "attackmap-analyzer-java-spring @ git+https://github.com/mlaify/attackmap-analyzer-java-spring.git@958010d1245988de530131b5596b5f9809420597",
  "attackmap-analyzer-dotnet @ git+https://github.com/mlaify/attackmap-analyzer-dotnet.git@1196bbfe2cccde448f9da639c2ce5595c3dd5aba",
  "attackmap-analyzer-terraform @ git+https://github.com/mlaify/attackmap-analyzer-terraform.git@6ea7d52e9fabb85ad0ef4b4dea31d5702c8cc677",
  "attackmap-analyzer-c @ git+https://github.com/mlaify/attackmap-analyzer-c.git@bd1a1806b80f0f824befdd00bca992407e76a34b",
  "attackmap-analyzer-cpp @ git+https://github.com/mlaify/attackmap-analyzer-cpp.git@24388da39c95b562bb9bccbf483e20a162d7055f",
  "attackmap-analyzer-swift @ git+https://github.com/mlaify/attackmap-analyzer-swift.git@07344c54be7042a24145803729e6ae2548476f96",
  "attackmap-analyzer-node-service @ git+https://github.com/mlaify/attackmap-analyzer-node-service.git@05638b5ac192bfd8249bd5199e2256171aafa32d",
  "attackmap-analyzer-atproto @ git+https://github.com/mlaify/attackmap-analyzer-atproto.git@5aeee5bb231cc2720bba384214da62e70af670cb",
  "attackmap-analyzer-php-web @ git+https://github.com/mlaify/attackmap-analyzer-php-web.git@732a7cb276b8e6503a0bfd064b1f9610924217e8",
  "attackmap-analyzer-php-laminas @ git+https://github.com/mlaify/attackmap-analyzer-php-laminas.git@0c53f2542d7878a09b5291949b3a3be404c3f6db",
  "attackmap-analyzer-omeka-s @ git+https://github.com/mlaify/attack-map-analyzer-omeka-s.git@9a7a820eea0ec1b6bd7680291f53aefa76256e13",
  "attackmap-analyzer-iac @ git+https://github.com/mlaify/attackmap-analyzer-iac.git@4b3d60aa349f37b67b83418ec0841675cf492fb9",
]
dev = [
  "pytest>=8.0.0",
  "build>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/mlaify/AttackMap"
Documentation = "https://github.com/mlaify/AttackMap/wiki"
Repository = "https://github.com/mlaify/AttackMap"
Issues = "https://github.com/mlaify/AttackMap/issues"
Changelog = "https://github.com/mlaify/AttackMap/blob/main/CHANGELOG.md"

[project.scripts]
attackmap = "attackmap.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "attackmap.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
