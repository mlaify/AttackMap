# Leaked-credential rules (#251, part 2). AttackMap never keeps a secret's
# value (every hint is redacted to its first four characters), so a rule for
# a specific key carries a placeholder you replace with the leaked key id.

templates:
  aws-leaked-access-key-cloudtrail:
    date: "2026-10-12"
    title: "Use of an AWS access key that was committed to the repository"
    description: >-
      CloudTrail events signed with the access key AttackMap found hard-coded
      in ${locations} (rule ${rule_id}). Replace ${placeholder} with the full
      key id (AKIA…, from the file or from IAM). Rotate the workload to a new
      key first; then keep the leaked key active on a user with no
      permissions, so every use by whoever copied it is logged (as
      AccessDenied) and matches this rule. A deleted or deactivated key fails
      authentication before CloudTrail records the call.
    logsource:
      product: aws
      service: cloudtrail
    fields_required: [userIdentity.accessKeyId, eventName, eventSource, sourceIPAddress, userAgent, errorCode]
    detection:
      selection:
        userIdentity.accessKeyId: "${placeholder}"
      condition: selection
    falsepositives:
      - None once the workload has moved to a new key; before that, the legitimate workload itself
    level: high
    test_events:
      positive:
        - eventSource: sts.amazonaws.com
          eventName: GetCallerIdentity
          sourceIPAddress: 203.0.113.99
          errorCode: AccessDenied
          userIdentity:
            type: IAMUser
            accessKeyId: "${placeholder}"
      negative:
        - eventSource: sts.amazonaws.com
          eventName: GetCallerIdentity
          sourceIPAddress: 10.0.0.5
          userIdentity:
            type: IAMUser
            accessKeyId: AKIAEXAMPLEOTHERKEY0

data:
  # SecretHint / SecretHistoryHit kinds that are AWS access key ids.
  aws_key_kinds: [aws_access_key]
  placeholder: REPLACE_WITH_LEAKED_ACCESS_KEY_ID
