# Hardened: the workflow_run job only reads the base repo and never
# downloads or executes anything from the triggering run.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3
        with:
          persist-credentials: false
      - run: ./scripts/summarize.sh
